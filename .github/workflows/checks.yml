name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  generated-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 星表の再生成は外部取得が必要。自己完結したシミュレータだけをCIで照合する。
      - name: 天球シミュレータが最新か確かめる
        run: python3 tools/build-simulator.py --check
