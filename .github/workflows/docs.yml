name: Docs

# paths で絞ると SDK のバージョンを上げる PR などで回らず、落ちるのが main に入ってから
# になる。ジョブは数分で終わるので、すべての PR と main への push で回す。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # コード例のコンパイルと ktlint は CI から外している。SDK が private な GitHub Packages に
  # あり、取得に read:packages の PAT が要るため。team-e は全員ローカルに PAT を持っているので、
  # 検証は各自の手元で行う（CONTRIBUTING.md を参照）。
  #
  #     cd samples/kmp && ./gradlew :snippets:compileDebugKotlin :snippets:ktlintCheck
  #
  # 貼り付け済みのコード例と docs/ の食い違いは認証なしで見られるので、ここに残す。
  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docs のコード例が最新か確かめる
        run: python3 scripts/sync-snippets.py --check

      # 星表の生成物（build-star-catalog.py --check）は d3-celestial の取得にネットワークが
      # 要るので CI では回さない。data/ を触ったら手元で確かめる。
      - name: 天球シミュレータが最新か確かめる
        run: python3 tools/build-simulator.py --check

  # サイトの公開はしていない（下の注記を参照）。ビルドが壊れていないことだけを PR で見る。
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: docs
          bundler-cache: true

      - name: サイトがビルドできることを確かめる
        working-directory: docs
        run: bundle exec jekyll build --trace

# GitHub Pages への公開ジョブは外してある。SDK ドキュメントは上流の
# jig-SABERA/sabera-sdk が公開しており、team-e が二重に出す必要がないため。
# 手元で読むときは docs/ で bundle exec jekyll serve する。
